name: build

on:
  workflow_dispatch:
    inputs:
      subversion:
        description: 'Sub-version, the last number of the pack version (eg: 1)'
        required: true
        default: '1'
        type: string

jobs:
  multiplatform:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
    - uses: actions/cache@v6
      with:
        key: env-files-win-laz
        path: |
          ${{ github.workspace }}/tool/data
    - run: pip install -r requirements.txt
    - run: |
        .\build.bat setup
        .\build.bat pack -p multiplatform -v ${{ inputs.subversion }} --no-zip
    - uses: actions/upload-artifact@v4
      with:
        name: bedralis-multiplatform
        path: ./build/pack-multiplatform
